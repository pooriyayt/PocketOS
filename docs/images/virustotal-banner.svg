<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 120" width="780" height="120">
  <defs>
    <linearGradient id="vtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#022027"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="776" height="116" rx="20" fill="url(#vtGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.45"/>
  
  <!-- Left VirusTotal Emblem & Shield -->
  <g transform="translate(36, 24)">
    <!-- Glowing ring -->
    <circle cx="36" cy="36" r="34" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" stroke-width="1.5"/>
    <!-- Shield check icon -->
    <path fill="url(#shieldGrad)" d="M36,12 L54,20 C54,34 46,47 36,54 C26,47 18,34 18,20 L36,12 Z" />
    <path fill="#FFFFFF" d="M32.5,39.5 L25.5,32.5 L28,30 L32.5,34.5 L44,23 L46.5,25.5 L32.5,39.5 Z" />
  </g>

  <!-- Title & Subtitle -->
  <text x="130" y="47" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">VirusTotal Verified Clean • 0 / 66 Detections</text>
  <text x="130" y="74" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Official Release v1.5.1 • 100% Offline • Hardware-Backed Keystore • No Droppers</text>

  <!-- Right Pill Button "View Report →" -->
  <g transform="translate(620, 38)">
    <rect width="130" height="44" rx="22" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.2"/>
    <text x="65" y="27" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">View Report ↗</text>
  </g>
</svg>
